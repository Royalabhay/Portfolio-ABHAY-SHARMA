<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Abhay Sharma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas class="space-canvas" aria-hidden="true"></canvas>
    <header class="site-header">
      <a class="brand" href="index.html">Abhay Sharma</a>
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">☰</button>
      <nav class="site-nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main>
      <section class="glass section-head">
        <h1>Contact</h1>
        <p>Let’s discuss your next website update.</p>
      </section>

      <section class="glass contact-wrap">
        <form class="contact-form" novalidate>
          <label>Name<input type="text" placeholder="Your name" required /></label>
          <label>Email<input type="email" placeholder="you@example.com" required /></label>
          <label>Project Goal<textarea rows="5" placeholder="Tell me what you want to improve." required></textarea></label>
          <button class="btn" type="submit">Send Message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>
      <p>Email: hello@abhaysharma.dev</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
